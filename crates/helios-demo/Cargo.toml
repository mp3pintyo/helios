[package]
name = "helios-demo"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "helios"
path = "src/main.rs"

[dependencies]
helios-geometry.workspace = true
helios-asset.workspace = true
helios-render.workspace = true
wgpu.workspace = true
glam.workspace = true
log.workspace = true
web-time.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit.workspace = true
pollster.workspace = true
env_logger.workspace = true
png.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
console_error_panic_hook.workspace = true
console_log.workspace = true
js-sys = "0.3"
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlCanvasElement", "KeyboardEvent", "MouseEvent", "WheelEvent", "PointerEvent", "Performance", "HtmlElement", "CssStyleDeclaration", "DomRect", "AddEventListenerOptions", "EventTarget", "Event", "Location", "Response", "Url"] }

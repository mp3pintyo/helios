[package]
name = "helios-render"
description = "WebGPU renderer: GPU-driven virtual geometry, visibility buffer, physically based lighting."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
helios-geometry.workspace = true
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true
log.workspace = true
# Upload time budgets (std::time::Instant is unavailable in wasm).
web-time.workspace = true

# HTTP range requests for streaming geometry in the browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys = "0.3"
web-sys = { workspace = true, features = ["Window", "Request", "RequestInit", "Headers", "Response"] }

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }
# examples/headless.rs
pollster.workspace = true
png.workspace = true

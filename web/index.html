<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Helios — WebGPU virtual geometry & lighting</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #0b0d12; overflow: hidden; font: 13px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace; color: #e8ecf3; }
    #helios-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
    #helios-canvas:active { cursor: grabbing; }
    .panel { position: fixed; left: 12px; background: rgba(8, 10, 14, 0.62); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 8px 11px; white-space: pre; pointer-events: none; max-width: calc(100vw - 48px); overflow: hidden; text-overflow: ellipsis; }
    #hud { top: 12px; }
    #help { bottom: 12px; color: #aab3c2; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; font-size: 15px; pointer-events: none; text-align: center; padding: 24px; }
    #status:empty { display: none; }
    .title { position: fixed; right: 14px; top: 12px; font-weight: 600; letter-spacing: 0.06em; color: rgba(255,255,255,0.75); pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="helios-canvas" tabindex="0"></canvas>
  <div id="hud" class="panel"></div>
  <div id="help" class="panel"></div>
  <div class="title">HELIOS · WebGPU</div>
  <div id="status">Loading…</div>
  <script type="module">
    import init from "./pkg/helios_demo.js";
    if (!navigator.gpu) {
      document.getElementById("status").textContent =
        "This browser does not expose WebGPU (navigator.gpu). Use Chrome/Edge 113+, Safari 26+ or Firefox 141+.";
    } else {
      init().catch((e) => { document.getElementById("status").textContent = "Failed to start: " + e; });
    }
    // Tab opens the editor around the running scene (editor.html opens it directly).
    window.addEventListener("keydown", (e) => {
      if (e.code === "Tab" && !globalThis.heliosEditorMounted) {
        e.preventDefault();
        import("./editor/editor.js").then((m) => m.mountEditor());
      }
    });
  </script>
</body>
</html>
